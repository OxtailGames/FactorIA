# Continuous integration. Every job uses the same CMake presets as local builds
# (CMakePresets.json, ./scripts/build.sh), so a green run means the local
# commands work on that platform too.
name: CI

# All five platforms on GitHub-hosted runners (standard hosted runners are free
# for public repositories). Runs once per change: on pull requests (every push to
# a PR branch), on pushes to main and on `v*` tags. Pushing to a branch without a
# PR does not trigger a run, so PR branches are not built twice; use "Run
# workflow" (workflow_dispatch) for those. The same checks can run locally with
# ./scripts/ci-local.sh (see docs/BUILDING.md).
# Each run only builds what the change can break, and `CI result` is the check that
# auto-merge waits for: docs/BUILDING.md, "Continuous integration".
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      perfBaselines:
        description: 'Only record the examples'' performance baselines on each runner (the "Perf baselines" job); builds and tests nothing else'
        type: boolean
        default: false
      benchBaselines:
        description: 'Only record the microbenchmark baselines (fa_bench) on each runner (the "Bench baselines" job); builds and tests nothing else'
        type: boolean
        default: false

# Keep only the newest run per branch or pull request. The event and the perfBaselines and benchBaselines ticks are part of
# the group, so a manual "Perf baselines" or "Bench baselines" run and a push or pull request run on the same ref do not
# cancel each other.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}-${{ inputs.perfBaselines || false }}-${{ inputs.benchBaselines || false }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # What this change needs: `code` (anything but docs) for the desktop jobs, `mobile` for the iOS and Android ones, `web` for the web export.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
      mobile: ${{ steps.diff.outputs.mobile }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the base commit of the diff

      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PERF_ONLY: ${{ github.event_name == 'workflow_dispatch' && (inputs.perfBaselines || inputs.benchBaselines) }}
        run: |
          # "Run workflow" with perfBaselines ticked builds and tests nothing: only the `perf-baselines` job runs (with
          # benchBaselines ticked, only the `bench-baselines` job).
          if [[ "$PERF_ONLY" == "true" ]]; then
            echo "Only the perf baselines run"
            { echo "code=false"; echo "mobile=false"; echo "web=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Tags, "Run workflow" and pushes without a usable base (git diff fails) run everything.
          if [[ "$GITHUB_REF" == refs/tags/* ]] || ! files="$(git diff --name-only "$BASE" HEAD)"; then
            echo "Everything runs ($GITHUB_EVENT_NAME $GITHUB_REF)"
            { echo "code=true"; echo "mobile=true"; echo "web=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$files"
          docs='^(docs/|feedback/|[^/]+\.md$|LICENSE$)'
          # The mobile jobs build the engine and player, export a game made from templates/ with the CLI, and run the
          # smoke scripts.
          mobile='^(engine/|player/|platforms/|external/|cmake/|templates/|tools/common/|tools/cli/|scripts/|CMakeLists\.txt$|CMakePresets\.json$|\.github/workflows/ci\.yml$)'
          if grep -Evq "$docs" <<< "$files"; then code=true; else code=false; fi
          if grep -Eq "$mobile" <<< "$files"; then mobile=true; else mobile=false; fi
          # The web job builds the same things (engine, player, CLI, templates) and runs the export and its smoke script.
          web=$mobile
          echo "code=$code mobile=$mobile web=$web"
          { echo "code=$code"; echo "mobile=$mobile"; echo "web=$web"; } >> "$GITHUB_OUTPUT"

  # Linux: GCC + Ninja. Tests run under Xvfb with Mesa llvmpipe, so headless
  # GPU code gets a software OpenGL/EGL renderer.
  linux:
    name: Linux (Ubuntu 24.04, GCC)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90  # a cold-ccache build (~50 min on Linux) plus the full suite went past 60 in M91
    steps:
      - uses: actions/checkout@v4

      # Same package list as local development (see scripts/bootstrap-linux.sh).
      - name: Install build dependencies
        run: ./scripts/bootstrap-linux.sh

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-linux-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-linux-

      - name: Configure and build (linux-release)
        run: |
          ccache --zero-stats
          cmake --preset linux-release -DFA_WARNINGS_AS_ERRORS=ON
          cmake --build --preset linux-release
          ccache --show-stats --verbose

      # The ccache saved after the build keeps only the entries this build used (hit or written in the last two
      # hours). A restored cache otherwise keeps every object it ever held, and the repository's caches get 10 GB.
      - name: Trim ccache to what this build used
        if: ${{ !cancelled() }}
        run: ccache --evict-older-than 7200s

      # Saved right after the build, not at the end of the job: actions/cache saves only when the whole job passes, so
      # a run whose tests failed left the next run the old cache and a cold build (Windows: 35-45 min, 11% hits).
      - name: Save ccache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-linux-${{ github.run_id }}

      # The pinned sokol-shdc that custom materials need, installed the way a contributor does it (SHA-256 checked, into
      # ~/.factoria). FA_REQUIRE_SHDC=1 on the tests turns the ones that need it from skipped into failed.
      - name: Install the shader compiler (factoria setup shaders)
        shell: bash
        run: |
          cli=$(find build/linux-release/tools/cli -maxdepth 2 -type f \( -name factoria -o -name factoria.exe \) | head -n 1)
          test -n "$cli" || { echo "::error::factoria was not built under build/linux-release/tools/cli"; exit 1; }
          "$cli" setup shaders

      - name: Test under Xvfb (Mesa llvmpipe)
        env:
          FA_REQUIRE_SHDC: '1'
        run: xvfb-run -a -s "-screen 0 1280x720x24" ctest --preset linux-release --parallel 4  # the runner's 4 vCPUs

      # A `_perf` test inside the warning band passes and ctest prints nothing: list those in the log and the job summary
      # (scripts/ci-perf-warnings.sh reads Testing/Temporary/LastTest.log, so it runs before any other ctest in the tree).
      - name: Performance warnings (linux)
        if: ${{ !cancelled() }}
        run: ./scripts/ci-perf-warnings.sh build/linux-release

      # The hashes of the replays, in the log of every job: FA_PHYSICS_REPLAY_HASH (committed in
      # engine/physics/tests/test_determinism.cpp) and the FA_DET_HASH lines of the particles, the feel effects (committed in
      # engine/scene/tests/test_det_replay.cpp) and of the scripts' Math, 2D and 3D physics and nav (tools/cli/tests/determinism_expected.txt,
      # engine/runtime/tests/det_probe_tests.cpp). The tests above compare them; this step prints them even when a test failed, so a mismatch
      # shows what to commit. The Linux, Windows and macOS lines should be equal (docs/AI_GUIDE.md, "Physics and platforms").
      - name: Replay hashes (linux) - physics, particles, feel, scripts, nav
        if: ${{ !cancelled() }}
        run: ctest --preset linux-release -R "physics_determinism|det_replay_hashes|det_probe_hashes" -V

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-output
          path: |
            build/**/Testing/**
            build/**/test-output/**/*.png
          if-no-files-found: ignore
          retention-days: 7

  # Linux with Clang and AddressSanitizer + UndefinedBehaviorSanitizer (and LeakSanitizer, which only Linux has): the whole
  # Debug suite on a build whose every target, external/ included, is instrumented (FA_SANITIZE, preset linux-asan;
  # docs/BUILDING.md, "Sanitizers"). A finding fails the test (UBSan stops at the first one). The suppressions are
  # tools/ci/sanitizers/*.supp. Debug: the example games' tests are disabled, as in any Debug build.
  linux-asan:
    name: Linux (Clang, ASan + UBSan)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150  # instrumented code runs 2-3x slower than the Debug build of the linux job; a cold ccache adds the build
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          ./scripts/bootstrap-linux.sh
          sudo apt-get install -y clang llvm  # llvm: llvm-symbolizer, for readable sanitizer stack traces

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-linux-asan-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-linux-asan-

      - name: Configure and build (linux-asan)
        run: |
          ccache --zero-stats
          cmake --preset linux-asan -DFA_WARNINGS_AS_ERRORS=ON
          cmake --build --preset linux-asan
          ccache --show-stats --verbose

      - name: Trim ccache to what this build used
        if: ${{ !cancelled() }}
        run: ccache --evict-older-than 7200s

      - name: Save ccache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-linux-asan-${{ github.run_id }}

      - name: Install the shader compiler (factoria setup shaders)
        shell: bash
        run: |
          cli=$(find build/linux-asan/tools/cli -maxdepth 2 -type f \( -name factoria -o -name factoria.exe \) | head -n 1)
          test -n "$cli" || { echo "::error::factoria was not built under build/linux-asan/tools/cli"; exit 1; }
          "$cli" setup shaders

      - name: Fewer ASLR bits (the sanitizers' shadow memory fails to map on the runner's newer kernels otherwise)
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Test under Xvfb (Mesa llvmpipe), ASan + UBSan + LSan
        env:
          FA_REQUIRE_SHDC: '1'
        run: xvfb-run -a -s "-screen 0 1280x720x24" ctest --preset linux-asan --parallel 4  # the runner's 4 vCPUs

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-asan-test-output
          path: |
            build/**/Testing/**
            build/**/test-output/**/*.png
          if-no-files-found: ignore
          retention-days: 7

  # Linux with Clang and ThreadSanitizer: only the tests that run threads (ctest label `tsan`: the job system and the background
  # reads in core, the jobs engine and the background loads in runtime, all of audio and of mcp; CMakeLists.txt, "ThreadSanitizer").
  # A data race fails the test (TSan's exit code). The suppressions are tools/ci/sanitizers/tsan.supp.
  linux-tsan:
    name: Linux (Clang, TSan, threaded tests)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          ./scripts/bootstrap-linux.sh
          sudo apt-get install -y clang llvm

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-linux-tsan-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-linux-tsan-

      # Only the targets the threaded tests link, not the editor, the player or the other test programs.
      - name: Configure and build (linux-tsan)
        run: |
          ccache --zero-stats
          cmake --preset linux-tsan -DFA_WARNINGS_AS_ERRORS=ON
          cmake --build --preset linux-tsan --target fa_test_core fa_test_runtime fa_test_audio fa_test_mcp
          ccache --show-stats --verbose

      - name: Trim ccache to what this build used
        if: ${{ !cancelled() }}
        run: ccache --evict-older-than 7200s

      - name: Save ccache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-linux-tsan-${{ github.run_id }}

      - name: Fewer ASLR bits (the sanitizers' shadow memory fails to map on the runner's newer kernels otherwise)
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Test under Xvfb (Mesa llvmpipe), ThreadSanitizer
        run: xvfb-run -a -s "-screen 0 1280x720x24" ctest --preset linux-tsan -L tsan --parallel 2

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-tsan-test-output
          path: build/**/Testing/**
          if-no-files-found: ignore
          retention-days: 7

  # The Linux release programs, built the way release.yml builds them: in the Steam Runtime "sniper" SDK container (glibc
  # 2.31, GCC 14, libstdc++ and libgcc static), so they run on the Steam Linux Runtime (Steam, the Steam Deck), Ubuntu 20.04
  # and newer, Debian 11 and newer. Builds the preset linux-sniper (no tests: the `linux` job has them), fails when factoria
  # or factoria_player imports a glibc/GLIBCXX/CXXABI version newer than sniper has, then runs them in the sniper RUNTIME
  # image (the `platform` one, with no compilers and nothing installed): `--version`, a new project, a headless frame on
  # Mesa's software renderer. All of it is scripts/build-sniper.sh (docs/BUILDING.md), so it runs locally with Docker or Podman.
  linux-sniper:
    name: Linux (Steam Runtime sniper)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The script mounts ~/.cache/ccache into the container. release.yml reads this cache (key ccache-Linux-sniper-).
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-sniper-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-sniper-

      - name: Build in the sniper SDK container (GCC 14, static libstdc++)
        run: ./scripts/build-sniper.sh build -- -DFA_WARNINGS_AS_ERRORS=ON

      - name: Check the symbol versions the programs need
        run: ./scripts/build-sniper.sh check

      - name: Run in the sniper runtime container (version, new project, headless frame)
        run: ./scripts/build-sniper.sh smoke

  # Windows: MSVC through the Visual Studio 2022 generator. Headless GPU code
  # uses the D3D11 software adapter (WARP).
  # One command per step, so a failing command fails the step (PowerShell).
  # Three machines, each builds (from the same ccache) and runs a third of the suite: one test at a time already fills a
  # runner's 4 vCPUs (see the Test step), so the suite's 30 minutes only shrink on more machines. scripts/ctest_shard.py
  # gives every test to exactly one shard, balanced by the times it lists.
  windows:
    name: Windows (Visual Studio 2022, MSVC, tests ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2022  # the preset uses the "Visual Studio 17 2022" generator; windows-latest now ships VS 2026
    timeout-minutes: 90  # a build with a cold ccache takes 35-60 min
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      # Visual Studio ignores compiler launchers, so MSBuild runs ccache as cl.exe (CLToolPath), one source per call
      # in parallel (UseMultiToolTask). MSBuild reads both from the environment. ccache supports MSVC since 4.13.
      - name: Install ccache
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ccache.zip" https://github.com/ccache/ccache/releases/download/v4.14.1/ccache-4.14.1-windows-x86_64.zip
          unzip -q "$RUNNER_TEMP/ccache.zip" -d "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/ccache-cl"
          cp "$RUNNER_TEMP/ccache-4.14.1-windows-x86_64/ccache.exe" "$RUNNER_TEMP/ccache-cl/cl.exe"
          { echo "CLToolPath=$RUNNER_TEMP\ccache-cl"; echo "UseMultiToolTask=true"; } >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~\AppData\Local\ccache  # ccache's default directory on Windows
          key: ccache-${{ runner.os }}-windows-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-windows-

      - name: Reset the ccache statistics
        shell: bash
        run: '"$RUNNER_TEMP/ccache-4.14.1-windows-x86_64/ccache.exe" --zero-stats'

      - name: Configure (windows-release)
        run: cmake --preset windows-release -DFA_WARNINGS_AS_ERRORS=ON

      - name: Build (windows-release)
        run: cmake --build --preset windows-release --parallel

      - name: ccache statistics
        if: ${{ !cancelled() }}
        shell: bash
        run: '"$RUNNER_TEMP/ccache-4.14.1-windows-x86_64/ccache.exe" --show-stats --verbose'

      - name: Trim ccache to what this build used (see the linux job)
        if: ${{ !cancelled() && matrix.shard == 1 }}
        shell: bash
        run: '"$RUNNER_TEMP/ccache-4.14.1-windows-x86_64/ccache.exe" --evict-older-than 7200s'

      # Saved even when the tests fail (see the linux job). The shards build the same objects, so one of them saves.
      - name: Save ccache
        if: ${{ !cancelled() && matrix.shard == 1 }}
        uses: actions/cache/save@v4
        with:
          path: ~\AppData\Local\ccache  # ccache's default directory on Windows
          key: ccache-${{ runner.os }}-windows-${{ github.run_id }}

      # The pinned sokol-shdc that custom materials need, installed the way a contributor does it (SHA-256 checked, into
      # ~/.factoria). FA_REQUIRE_SHDC=1 on the tests turns the ones that need it from skipped into failed.
      - name: Install the shader compiler (factoria setup shaders)
        shell: bash
        run: |
          cli=$(find build/windows-release/tools/cli -maxdepth 2 -type f \( -name factoria -o -name factoria.exe \) | head -n 1)
          test -n "$cli" || { echo "::error::factoria was not built under build/windows-release/tools/cli"; exit 1; }
          "$cli" setup shaders

      # The runner's desktop is 1024x768, which shrinks the editor autotest's 1600x900 window and hides widgets it clicks.
      - name: Display resolution for the editor autotest
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Get-CimInstance Win32_VideoController | Select-Object CurrentHorizontalResolution, CurrentVerticalResolution

      - name: Test (windows-release, shard ${{ matrix.shard }}/3)
        env:
          FA_REQUIRE_SHDC: '1'
        # One test at a time: the software D3D11 (WARP) of the editor autotests and the tooling suite already fill the 4
        # vCPUs. With --parallel 4 the step took longer (17.5 min against 15) and the timing-sensitive tests failed.
        run: python scripts/ctest_shard.py --preset windows-release --shard ${{ matrix.shard }} --of 3

      # Each shard's own LastTest.log: the `_perf` tests that passed inside the warning band (see the linux job).
      - name: Performance warnings (windows, shard ${{ matrix.shard }}/3)
        if: ${{ !cancelled() }}
        shell: bash
        run: ./scripts/ci-perf-warnings.sh build/windows-release

      # The hashes of the replays, in the log of every job: FA_PHYSICS_REPLAY_HASH (committed in
      # engine/physics/tests/test_determinism.cpp) and the FA_DET_HASH lines of the particles, the feel effects (committed in
      # engine/scene/tests/test_det_replay.cpp) and of the scripts' Math, 2D and 3D physics and nav (tools/cli/tests/determinism_expected.txt,
      # engine/runtime/tests/det_probe_tests.cpp). The tests above compare them; this step prints them even when a test failed, so a mismatch
      # shows what to commit. The Linux, Windows and macOS lines should be equal (docs/AI_GUIDE.md, "Physics and platforms").
      - name: Replay hashes (windows) - physics, particles, feel, scripts, nav
        if: ${{ !cancelled() && matrix.shard == 1 }}
        run: ctest --preset windows-release -R "physics_determinism|det_replay_hashes|det_probe_hashes" -V

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-output-${{ matrix.shard }}
          path: |
            build/**/Testing/**
            build/**/test-output/**/*.png
          if-no-files-found: ignore
          retention-days: 7

  # macOS: Apple Clang + Ninja. The whole suite runs, GPU-labelled tests included: Metal on the runner's GPU, and the
  # editor autotests in a real window of the runner's desktop session.
  macos:
    name: macOS (Apple Clang, Ninja)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 90  # a cold-ccache build (~50 min on Linux) plus the full suite went past 60 in M91
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja and ccache
        run: brew install ninja ccache

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-macos-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-macos-

      - name: Configure and build (macos-release)
        run: |
          ccache --zero-stats
          cmake --preset macos-release -DFA_WARNINGS_AS_ERRORS=ON
          cmake --build --preset macos-release
          ccache --show-stats --verbose

      - name: Trim ccache to what this build used (see the linux job)
        if: ${{ !cancelled() }}
        run: ccache --evict-older-than 7200s

      # Saved even when the tests fail (see the linux job).
      - name: Save ccache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-macos-${{ github.run_id }}

      # The pinned sokol-shdc that custom materials need, installed the way a contributor does it (SHA-256 checked, into
      # ~/.factoria). FA_REQUIRE_SHDC=1 on the tests turns the ones that need it from skipped into failed.
      - name: Install the shader compiler (factoria setup shaders)
        shell: bash
        run: |
          cli=$(find build/macos-release/tools/cli -maxdepth 2 -type f \( -name factoria -o -name factoria.exe \) | head -n 1)
          test -n "$cli" || { echo "::error::factoria was not built under build/macos-release/tools/cli"; exit 1; }
          "$cli" setup shaders

      - name: Test (macos-release)
        env:
          FA_REQUIRE_SHDC: '1'
        run: ctest --preset macos-release --parallel 3  # the runner's 3 vCPUs

      - name: Performance warnings (macos)
        if: ${{ !cancelled() }}
        run: ./scripts/ci-perf-warnings.sh build/macos-release

      # The hashes of the replays, in the log of every job: FA_PHYSICS_REPLAY_HASH (committed in
      # engine/physics/tests/test_determinism.cpp) and the FA_DET_HASH lines of the particles, the feel effects (committed in
      # engine/scene/tests/test_det_replay.cpp) and of the scripts' Math, 2D and 3D physics and nav (tools/cli/tests/determinism_expected.txt,
      # engine/runtime/tests/det_probe_tests.cpp). The tests above compare them; this step prints them even when a test failed, so a mismatch
      # shows what to commit. The Linux, Windows and macOS lines should be equal (docs/AI_GUIDE.md, "Physics and platforms").
      - name: Replay hashes (macos) - physics, particles, feel, scripts, nav
        if: ${{ !cancelled() }}
        run: ctest --preset macos-release -R "physics_determinism|det_replay_hashes|det_probe_hashes" -V

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-output
          path: |
            build/**/Testing/**
            build/**/test-output/**/*.png
          if-no-files-found: ignore
          retention-days: 7

  # Microbenchmarks (fa_bench, docs/PERFORMANCE.md, "Microbenchmarks"): a Release build of the benchmark program only, run
  # under Xvfb with Mesa llvmpipe like the tests, and compared with tools/bench/baselines/<runner>.json (runner linux-gcc).
  # A benchmark over its fail limit (x2, x2.5 for the render ones, on the median) fails the job; one in the warning band is
  # annotated. A benchmark or a whole runner without a baseline entry only warns and the numbers are still uploaded, so the
  # first linux-gcc.json comes from this job's artifact (or from the `bench-baselines` job below). ccache is restored from the
  # `linux` job's newest cache and not saved here.
  bench:
    name: Microbenchmarks (Linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: ./scripts/bootstrap-linux.sh

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-linux-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-linux-

      - name: Configure and build fa_bench (linux-release)
        run: |
          cmake --preset linux-release -DFA_WARNINGS_AS_ERRORS=ON
          cmake --build --preset linux-release --target fa_bench --parallel

      - name: Run the microbenchmarks
        run: |
          mkdir -p bench-results
          xvfb-run -a -s "-screen 0 1280x720x24" build/linux-release/tools/bench/fa_bench --compare \
              --out bench-results/measurements.json --report bench-results/comparison.json

      - name: Upload the numbers
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bench-linux
          path: bench-results
          if-no-files-found: warn
          retention-days: 30

  # Bench baselines: "Run workflow" with benchBaselines ticked (the `changes` job then skips every other job). Builds fa_bench
  # on each runner and runs `fa_bench --update-baseline`, which merges its numbers into tools/bench/baselines/<runner>.json
  # (linux-gcc, windows-msvc, macos-clang), uploaded as the artifact bench-baselines-<os>. Nothing is committed: copy the
  # file into tools/bench/baselines/. Not part of `CI result`: it only runs on request.
  bench-baselines:
    name: Bench baselines (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.benchBaselines
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: ubuntu-24.04, preset: linux-release }
          - { os: windows, runner: windows-2022, preset: windows-release }
          - { os: macos, runner: macos-latest, preset: macos-release }
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (linux)
        if: matrix.os == 'linux'
        run: ./scripts/bootstrap-linux.sh

      - name: Install Ninja and ccache (macos)
        if: matrix.os == 'macos'
        run: brew install ninja ccache

      - name: Restore ccache
        if: matrix.os != 'windows'
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.os == 'linux' && '~/.cache/ccache' || '~/Library/Caches/ccache' }}
          key: ccache-${{ runner.os }}-${{ matrix.os }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-${{ matrix.os }}-

      - name: Install ccache (windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ccache.zip" https://github.com/ccache/ccache/releases/download/v4.14.1/ccache-4.14.1-windows-x86_64.zip
          unzip -q "$RUNNER_TEMP/ccache.zip" -d "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/ccache-cl"
          cp "$RUNNER_TEMP/ccache-4.14.1-windows-x86_64/ccache.exe" "$RUNNER_TEMP/ccache-cl/cl.exe"
          { echo "CLToolPath=$RUNNER_TEMP\ccache-cl"; echo "UseMultiToolTask=true"; } >> "$GITHUB_ENV"

      - name: Restore ccache (windows)
        if: matrix.os == 'windows'
        uses: actions/cache/restore@v4
        with:
          path: ~\AppData\Local\ccache
          key: ccache-${{ runner.os }}-windows-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-windows-

      - name: Configure and build fa_bench (${{ matrix.preset }})
        shell: bash
        run: |
          cmake --preset ${{ matrix.preset }} -DFA_WARNINGS_AS_ERRORS=ON
          cmake --build --preset ${{ matrix.preset }} --target fa_bench --parallel

      - name: Measure the baseline
        shell: bash
        run: |
          bench=$(find build/${{ matrix.preset }}/tools/bench -maxdepth 2 -type f \( -name fa_bench -o -name fa_bench.exe \) | head -n 1)
          test -n "$bench" || { echo "::error::fa_bench was not built under build/${{ matrix.preset }}/tools/bench"; exit 1; }
          if [[ "${{ matrix.os }}" == "linux" ]]; then
            xvfb-run -a -s "-screen 0 1280x720x24" "$bench" --update-baseline
          else
            "$bench" --update-baseline
          fi
          mkdir -p bench-baselines && cp tools/bench/baselines/${{ matrix.os }}-*.json bench-baselines/

      - name: Upload the baseline
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bench-baselines-${{ matrix.os }}
          path: bench-baselines
          if-no-files-found: warn
          retention-days: 30

  # Perf baselines: "Run workflow" with perfBaselines ticked (the `changes` job then skips every other job). Builds factoria
  # the way the jobs above do and runs scripts/perf-baselines.sh on each runner: `perf.baseline` for every example scene,
  # whose entries (this runner's `runners.<id>`) are uploaded as the artifact perf-baselines-<os>. Nothing is committed: copy
  # the entries into tools/cli/tests/perf/ (docs/PERFORMANCE.md, "Baselines from CI"). A new example's first baselines come
  # from here, as `provisional` entries until then (KW/FB-0020). The runners and the build are the ones of the test jobs, so
  # the runner ids are the ones the `example_<name>_perf` tests look up. Not part of `CI result`: it only runs on request.
  perf-baselines:
    name: Perf baselines (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.perfBaselines
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: ubuntu-24.04, preset: linux-release }
          - { os: windows, runner: windows-2022, preset: windows-release }
          - { os: macos, runner: macos-latest, preset: macos-release }
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (linux)
        if: matrix.os == 'linux'
        run: ./scripts/bootstrap-linux.sh

      - name: Install Ninja and ccache (macos)
        if: matrix.os == 'macos'
        run: brew install ninja ccache

      # ccache, restored from the test jobs' newest cache and never saved here (see the jobs above for the Windows shim).
      - name: Restore ccache
        if: matrix.os != 'windows'
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.os == 'linux' && '~/.cache/ccache' || '~/Library/Caches/ccache' }}
          key: ccache-${{ runner.os }}-${{ matrix.os }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-${{ matrix.os }}-

      - name: Install ccache (windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ccache.zip" https://github.com/ccache/ccache/releases/download/v4.14.1/ccache-4.14.1-windows-x86_64.zip
          unzip -q "$RUNNER_TEMP/ccache.zip" -d "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/ccache-cl"
          cp "$RUNNER_TEMP/ccache-4.14.1-windows-x86_64/ccache.exe" "$RUNNER_TEMP/ccache-cl/cl.exe"
          { echo "CLToolPath=$RUNNER_TEMP\ccache-cl"; echo "UseMultiToolTask=true"; } >> "$GITHUB_ENV"

      - name: Restore ccache (windows)
        if: matrix.os == 'windows'
        uses: actions/cache/restore@v4
        with:
          path: ~\AppData\Local\ccache
          key: ccache-${{ runner.os }}-windows-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-windows-

      - name: Configure and build factoria (${{ matrix.preset }})
        shell: bash
        run: |
          cmake --preset ${{ matrix.preset }} -DFA_WARNINGS_AS_ERRORS=ON
          cmake --build --preset ${{ matrix.preset }} --target factoria --parallel

      - name: Measure the baselines
        shell: bash
        run: |
          cli=$(find build/${{ matrix.preset }}/tools/cli -maxdepth 2 -type f \( -name factoria -o -name factoria.exe \) | head -n 1)
          test -n "$cli" || { echo "::error::factoria was not built under build/${{ matrix.preset }}/tools/cli"; exit 1; }
          if [[ "${{ matrix.os }}" == "linux" ]]; then
            xvfb-run -a -s "-screen 0 1280x720x24" ./scripts/perf-baselines.sh "$cli" "$RUNNER_TEMP/perf-baselines"
          else
            ./scripts/perf-baselines.sh "$cli" "$RUNNER_TEMP/perf-baselines"
          fi
          mkdir -p perf-baselines && cp "$RUNNER_TEMP"/perf-baselines/* perf-baselines/

      - name: Upload the entries
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-baselines-${{ matrix.os }}
          path: perf-baselines
          if-no-files-found: warn
          retention-days: 30

  # iOS, in two jobs on two runners, because a simulator's first boot takes 5-7 minutes and slows a build on the same
  # machine: `ios-build` builds the player for the simulator with Xcode while `ios` boots the simulator, then `ios` runs
  # the app. Code signing is off for the build (the simulator does not need it; the smoke script signs ad hoc). No
  # ccache here: launcher support with the Xcode generator is not reliable.
  ios-build:
    name: iOS Simulator build (Xcode)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # The demo game declares the example native plugin (platforms/plugin, as `factoria call project.new_plugin` writes it:
      # {{NAME}} replaced, the API header in include/) and has a script that calls it. The plugin is built for the simulator
      # with the Xcode generator; its ios/ folder becomes plugins/example, as `factoria export --platform ios` lays it out for
      # build_ios.sh (this job does not build the CLI).
      - name: Build the example native plugin (simulator) and make a demo game that uses it
        run: |
          plugin="$RUNNER_TEMP/plugin-example"
          mkdir -p "$plugin/src" "$plugin/include" "$RUNNER_TEMP/plugins"
          cp platforms/plugin/src/plugin.c "$plugin/src/"
          cp engine/runtime/include/fa/runtime/fa_plugin.h "$plugin/include/"
          sed 's/{{NAME}}/example/g' platforms/plugin/CMakeLists.txt > "$plugin/CMakeLists.txt"
          cmake -S "$plugin" -B "$plugin/build" -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator -DCMAKE_OSX_DEPLOYMENT_TARGET=16.3
          cmake --build "$plugin/build" --config Release -- -sdk iphonesimulator
          archs=$(lipo -archs "$plugin/ios/iphonesimulator/libexample.a")
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]] || { echo "::error::libexample.a has '$archs', the player's simulator libraries have arm64 and x86_64"; exit 1; }
          cp -R "$plugin/ios" "$RUNNER_TEMP/plugins/example"

          # The Apple backend plugin (platforms/plugins/apple: Swift, StoreKit 2, Game Center, iCloud), instantiated the way
          # `factoria call project.new_plugin '{"template":"apple"}'` does ({{NAME}} replaced, the API header in include/) and
          # built for the simulator. Its ios/plugin.json (frameworks, Swift) becomes the flags build_ios.sh passes (next step).
          apple="$RUNNER_TEMP/plugin-apple"
          mkdir -p "$apple/include" "$RUNNER_TEMP/plugins"
          cp -R platforms/plugins/apple/. "$apple/"
          find "$apple" -type f -exec sed -i '' 's/{{NAME}}/apple/g' {} +
          cp engine/runtime/include/fa/runtime/fa_plugin.h "$apple/include/"
          cmake -S "$apple" -B "$apple/build" -DCMAKE_BUILD_TYPE=Release -DFA_APPLE_SLICES=iphonesimulator
          cmake --build "$apple/build"
          archs=$(lipo -archs "$apple/ios/iphonesimulator/libapple.a")
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]] || { echo "::error::libapple.a has '$archs', the player's simulator libraries have arm64 and x86_64"; exit 1; }
          cp -R "$apple/ios" "$RUNNER_TEMP/plugins/apple"

          game="$RUNNER_TEMP/plugin-game"
          cp -R templates/2d-platformer "$game"
          cp tools/cli/tests/plugin_probe.js "$game/scripts/probe.js"
          cp tools/cli/tests/apple_probe.js "$game/scripts/apple_probe.js"
          cp tools/cli/tests/determinism_probe.js "$game/scripts/determinism_probe.js"
          python3 - "$game" <<'PY'
          import json, pathlib, sys
          game = pathlib.Path(sys.argv[1])
          def edit(name, change):
              path = game / name
              data = json.loads(path.read_text(encoding="utf-8"))
              change(data)
              path.write_text(json.dumps(data, indent=2), encoding="utf-8")
          edit("factoria.json", lambda p: p.update(
              plugins={"example": {"path": "plugins/example", "platforms": ["ios"]},
                       "apple": {"path": "plugins/apple", "platforms": ["ios"]}},
              platform={"achievements": [{"id": "first_win", "name": "First win"}]}))
          def probes(s):
              s["entities"].append({"id": "probe", "name": "Probe", "components": {"Script": {"path": "scripts/probe.js"}}})
              s["entities"].append({"id": "appleProbe", "name": "Apple probe", "components": {"Script": {"path": "scripts/apple_probe.js"}}})
              s["entities"].append({"id": "detProbe", "name": "Determinism probe", "components": {"Script": {"path": "scripts/determinism_probe.js"}}})
          edit("scenes/main.scene.json", probes)
          PY

      # FA_GAME_PROJECT_DIR exercises the game-copy step (platforms/common/copy_game.cmake) and the Info.plist template;
      # FA_GAME_PLUGINS and FA_GAME_PLUGIN_DIR (build_ios.sh passes them) link the plugins (platforms/ios/plugins.cmake);
      # FA_GAME_PLUGIN_FRAMEWORKS and FA_GAME_PLUGIN_SWIFT come from the Apple plugin's manifest, as the export reads it.
      # The entitlements are left out: the simulator build is not signed.
      - name: Configure (ios-simulator, with the demo game and its native plugins)
        run: |
          frameworks=$(python3 -c "import json,sys; print(';'.join(json.load(open(sys.argv[1]))['frameworks']))" "$RUNNER_TEMP/plugins/apple/plugin.json")
          cmake --preset ios-simulator -DFA_WARNINGS_AS_ERRORS=ON -DFA_GAME_PROJECT_DIR="$RUNNER_TEMP/plugin-game" -DFA_GAME_PLUGINS="example;apple" \
                -DFA_GAME_PLUGIN_DIR="$RUNNER_TEMP/plugins" -DFA_GAME_PLUGIN_FRAMEWORKS="$frameworks" -DFA_GAME_PLUGIN_SWIFT=ON \
                -DFA_GAME_BUNDLE_ID=dev.factoria.ci -DFA_GAME_NAME="CI Game"

      - name: Build factoria_player (ios-simulator)
        run: cmake --build --preset ios-simulator --target factoria_player -- -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO

      # Packed with tar, which keeps the executable bit that artifacts drop.
      - name: Check the app bundle contains the game and a valid Info.plist, pack it
        run: |
          app=$(find build/ios-simulator -name factoria_player.app -type d | head -n 1)
          test -n "$app"
          test -f "$app/game/factoria.json"
          test ! -e "$app/game/ENGINE_FEEDBACK.json"
          plutil -lint "$app/Info.plist"
          tar -czf "$RUNNER_TEMP/ios-app.tgz" -C "$(dirname "$app")" factoria_player.app

      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: ${{ runner.temp }}/ios-app.tgz
          retention-days: 1

  # Run the app: boot an iPhone simulator, install and launch the .app with its console captured, and assert that
  # the process stays alive, the player logged "player: 60 frames rendered", an audio stream runs, a tap in the middle
  # of the screen (a UI test, platforms/ios/touch-test: simctl cannot inject touches) reaches the player at the middle
  # of the design, the app survives going to the background (Settings on top) and back and renders again, nothing
  # crashed, the native plugin linked into the app answers a script (docs/MOBILE.md, "Native plugins (iOS)") and the display
  # shows a picture (scripts/ios-smoke.sh; macOS runners are Apple Silicon, so the arm64 simulator slice runs natively).
  ios:
    name: iOS Simulator (run the app)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read  # gh run download: the app of ios-build, from this same run
    steps:
      - uses: actions/checkout@v4

      # Not `needs: ios-build`, which would only start the boot after the build. So that a build that ends without an app
      # (a failure, or a cancel when GitHub found no macOS runner for it: 2026-11-04) does not leave this loop spinning
      # until the step's 20 minutes run out, it asks for the build job's conclusion on every turn and stops at the first
      # one that is not "success".
      # --boot also builds the touch UI test meanwhile (1-4 minutes on this busy runner); `wait` lets it finish before
      # the smoke test, which then only runs it.
      - name: Boot the simulator and build the touch UI test while ios-build builds the app, then download the app
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/ios-smoke.sh --boot &
          until gh run download "$GITHUB_RUN_ID" -n ios-app -D "$RUNNER_TEMP" 2>/dev/null; do
            build=$(gh run view "$GITHUB_RUN_ID" --json jobs --jq '.jobs[] | select(.name == "iOS Simulator build (Xcode)") | .conclusion' 2>/dev/null || true)
            if [ -n "$build" ] && [ "$build" != success ]; then
              echo "::error::The job 'iOS Simulator build (Xcode)' ended with '$build' and produced no ios-app: there is no app to run (a cancelled build usually means GitHub did not get a macOS runner for it; see that job)."
              exit 1
            fi
            sleep 10
          done
          tar -xzf "$RUNNER_TEMP/ios-app.tgz" -C "$RUNNER_TEMP"
          wait

      # The app carries the example native plugin and the Apple backend plugin (ios-build): the smoke test checks the log of
      # the probe scripts that call them.
      - name: Run the app in the iOS Simulator (smoke test)
        env:
          FA_IOS_PLUGIN_PROBE: 1
          FA_IOS_APPLE_PROBE: 1
          FA_IOS_DET_HASH: 1
        run: ./scripts/ios-smoke.sh "$RUNNER_TEMP/factoria_player.app" dev.factoria.ci 90 build/ios-smoke

      - name: Upload simulator logs, screenshot and crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke
          path: build/ios-smoke
          if-no-files-found: ignore
          retention-days: 7

  # Web: the player built with Emscripten (the preset web-release, SDK pinned to the version in docs/BUILDING.md), the CLI,
  # a game exported with `factoria export --platform web`, the zip checked as itch.io takes it, and the export opened in the
  # runner's headless Chrome until the player has rendered 60 frames (scripts/web-smoke.sh, platforms/web/smoke.mjs).
  web:
    name: Web (Emscripten, headless Chrome)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EMSDK_VERSION: 6.0.10
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: ./scripts/bootstrap-linux.sh

      # The player is built by the Emscripten toolchain, the CLI by the runner's GCC: both through ccache.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-web-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-web-

      - name: Restore the Emscripten SDK
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}

      - name: Install the Emscripten SDK
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"

      # emsdk_env.sh exports EMSDK, which the presets read.
      - name: Build the web player (web-release)
        run: |
          EMSDK_QUIET=1 source ~/emsdk/emsdk_env.sh
          emcc --version | head -n 1
          cmake --preset web-release -DFA_WARNINGS_AS_ERRORS=ON
          cmake --build --preset web-release
          ls -l build/web-release/player

      - name: Build the factoria CLI (no editor, no tests)
        run: |
          cmake -S . -B build/tools -G Ninja -DCMAKE_BUILD_TYPE=Release -DFA_WARNINGS_AS_ERRORS=ON -DFA_BUILD_EDITOR=OFF -DFA_BUILD_TESTS=OFF
          cmake --build build/tools --target factoria

      - name: Trim ccache to what this build used (see the linux job)
        if: ${{ !cancelled() }}
        run: ccache --evict-older-than 7200s

      # Saved even when the tests fail (see the linux job).
      - name: Save ccache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-web-${{ github.run_id }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'  # platforms/web/smoke.mjs needs Node 22 (built-in WebSocket)

      # The runner image has google-chrome; smoke.mjs finds it in PATH.
      - name: Export a game and run it in headless Chrome
        run: |
          google-chrome --version
          ./scripts/web-smoke.sh build/tools/tools/cli/factoria build/web-release/player build/web-smoke

      - name: Upload the export and the screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke
          path: |
            build/web-smoke/web-smoke.png
            build/web-smoke/export
          if-no-files-found: ignore
          retention-days: 7

  # Android: arm64-v8a player library with the preinstalled NDK on the runner.
  android:
    name: Android arm64 (NDK, Ninja)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja and ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-android-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-android-

      # The runner image preinstalls several NDKs; the preset reads ANDROID_NDK_HOME.
      - name: Select the preinstalled NDK
        run: |
          test -f "$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Configure and build factoria_player (android-arm64)
        run: |
          cmake --preset android-arm64 -DFA_WARNINGS_AS_ERRORS=ON
          cmake --build --preset android-arm64 --target factoria_player

      - name: Trim ccache to what this build used (see the linux job)
        if: ${{ !cancelled() }}
        run: ccache --evict-older-than 7200s

      # Saved even when the tests fail (see the linux job).
      - name: Save ccache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-android-${{ github.run_id }}

      # The player must export ANativeActivity_onCreate (sokol_app) or NativeActivity cannot start it.
      - name: Check the entry points of libfactoria_player.so
        run: |
          nm="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$nm" -D --defined-only build/android-arm64/player/libfactoria_player.so | tee /tmp/symbols.txt
          grep -q ANativeActivity_onCreate /tmp/symbols.txt

  # Android end to end: `factoria export --platform android` writes the Gradle project and builds the APK itself, with
  # the project's own Gradle wrapper (AGP 8.13 + NDK + CMake 3.31 from the SDK). Slow: builds the host tools and the
  # engine for two ABIs.
  android-apk:
    name: Android APK (factoria export)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CCACHE_COMPILERCHECK: content  # sdkmanager unpacks the NDK anew each run, so its compilers' mtime changes
      FA_CI_PLUGINS: /tmp/ci-plugins  # where the game's native plugin lives: "${FA_CI_PLUGINS}/example" in its factoria.json
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: ./scripts/bootstrap-linux.sh

      # AGP 8.13 needs a JDK 17+; the export reads JAVA_HOME (and ANDROID_HOME for the SDK).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Also caches the engine's NDK build inside Gradle: CMakeLists.txt uses ccache whenever it finds it. The key must
      # not start with another job's (ccache-Linux-android-), or restore-keys would pick that job's cache.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-apk-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-apk-

      - name: Build the factoria CLI (no editor, no tests)
        run: |
          cmake -S . -B build/tools -G Ninja -DCMAKE_BUILD_TYPE=Release -DFA_WARNINGS_AS_ERRORS=ON -DFA_BUILD_EDITOR=OFF -DFA_BUILD_TESTS=OFF
          cmake --build build/tools --target factoria

      - name: Install SDK packages (CMake 3.31, NDK, platform 36, build-tools 35)
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" "cmake;3.31.6" "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"

      # A native plugin (docs/EXTENDING.md, section G; docs/MOBILE.md, "Native plugins on Android") outside the game, as a private SDK
      # would be: factoria.json says "${FA_CI_PLUGINS}/example". Its android/ folder is a Gradle module with a Java class;
      # its libexample.so is built here with the NDK's toolchain, once per ABI the APK carries. The game's script calls the
      # plugin when it starts (tools/cli/tests/plugin_probe.js) and the emulator job checks the log for the answers.
      - name: Create a game with a native plugin, built for both ABIs
        run: |
          factoria=build/tools/tools/cli/factoria
          $factoria new /tmp/ci-game --template 2d-platformer --name "CI Game" --id dev.factoria.cigame
          $factoria call project.new_plugin '{"name":"example","path":"${FA_CI_PLUGINS}/example","platforms":["android"]}' --project /tmp/ci-game
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          for abi in arm64-v8a x86_64; do
            "$sdk/cmake/3.31.6/bin/cmake" -S "$FA_CI_PLUGINS/example" -B "$FA_CI_PLUGINS/example/build/$abi" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DANDROID_ABI=$abi -DANDROID_PLATFORM=android-26 \
              -DCMAKE_TOOLCHAIN_FILE="$sdk/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
            "$sdk/cmake/3.31.6/bin/cmake" --build "$FA_CI_PLUGINS/example/build/$abi"
          done
          ls -l "$FA_CI_PLUGINS"/example/android/src/main/jniLibs/*/
          mkdir -p /tmp/ci-game/scripts
          cp tools/cli/tests/plugin_probe.js /tmp/ci-game/scripts/probe.js
          python3 - <<'PY'
          import json
          path = "/tmp/ci-game/scenes/main.scene.json"
          with open(path) as f:
              scene = json.load(f)
          scene["entities"].append({"id": "probe", "name": "Probe", "components": {"Script": {"path": "scripts/probe.js"}}})
          with open(path, "w") as f:
              json.dump(scene, f, indent=2)
          PY

      # The Google Play backend (platforms/plugins/googleplay, docs/PLATFORM.md section 7): platform.add_backend writes it into the game
      # and builds its C bridge for both ABIs with the SDK's NDK, CMake and Ninja installed above. The export below copies its Gradle
      # module, so Gradle adds Billing, Play Games and Play Integrity from Google's Maven repository and compiles the Java against
      # them. A Play Games project id is set so that the Play Games code is linked too. The game's script calls the backend when it
      # starts (tools/cli/tests/googleplay_probe.js); the emulator has no Google Play, so what it gets back are teaching refusals.
      - name: Add the Google Play backend (platform.add_backend), built for both ABIs
        run: |
          factoria=build/tools/tools/cli/factoria
          $factoria call platform.add_backend '{"backend":"googleplay","playGamesId":"123456789012"}' --project /tmp/ci-game
          ls -l /tmp/ci-game/plugins/googleplay/android/src/main/jniLibs/*/
          cp tools/cli/tests/googleplay_probe.js /tmp/ci-game/scripts/googleplay_probe.js
          python3 - <<'PY'
          import json
          path = "/tmp/ci-game/scenes/main.scene.json"
          with open(path) as f:
              scene = json.load(f)
          scene["entities"].append({"id": "googleplayProbe", "name": "Google Play probe", "components": {"Script": {"path": "scripts/googleplay_probe.js"}}})
          with open(path, "w") as f:
              json.dump(scene, f, indent=2)
          PY

      # The AdMob ads backend (platforms/plugins/admob, docs/PLATFORM.md section 8) next to the Google Play one: the game has a store
      # backend and an ads backend at once. platform.add_backend builds its C bridge for both ABIs; the export copies its Gradle module,
      # so Gradle adds the Mobile Ads SDK and Google's consent library and compiles the Java against them, and the manifest gets the
      # app id of a development export (Google's sample id). The probe (tools/cli/tests/admob_probe.js) checks what answers the ads and
      # that a call goes through the C bridge to the Java code. It loads no ad: that needs Google's network and Google Play.
      - name: Add the AdMob backend (platform.add_backend), built for both ABIs
        run: |
          factoria=build/tools/tools/cli/factoria
          $factoria call platform.add_backend '{"backend":"admob"}' --project /tmp/ci-game
          ls -l /tmp/ci-game/plugins/admob/android/src/main/jniLibs/*/
          cp tools/cli/tests/admob_probe.js /tmp/ci-game/scripts/admob_probe.js
          python3 - <<'PY'
          import json
          path = "/tmp/ci-game/scenes/main.scene.json"
          with open(path) as f:
              scene = json.load(f)
          scene["entities"].append({"id": "admobProbe", "name": "AdMob probe", "components": {"Script": {"path": "scripts/admob_probe.js"}}})
          with open(path, "w") as f:
              json.dump(scene, f, indent=2)
          PY

      # What a phone adds to the scripts (tools/cli/tests/mobile_probe.js): the game logs its safe area, buzzes once through the
      # Vibrator and consumes the Back button with input.onBack; scripts/android-smoke.sh sends KEYCODE_BACK and waits for that log
      # line (FA_SMOKE_BACK below), and the game must stay alive.
      - name: Add the mobile probe (safe area, vibration, Back)
        run: |
          cp tools/cli/tests/mobile_probe.js /tmp/ci-game/scripts/mobile_probe.js
          python3 - <<'PY'
          import json
          path = "/tmp/ci-game/scenes/main.scene.json"
          with open(path) as f:
              scene = json.load(f)
          scene["entities"].append({"id": "mobileProbe", "name": "Mobile probe", "components": {"Script": {"path": "scripts/mobile_probe.js"}}})
          with open(path, "w") as f:
              json.dump(scene, f, indent=2)
          PY

      # The replay hashes of the simulation scripts can reach (tools/cli/tests/determinism_probe.js, M91.3): Math.*, 2D and 3D
      # physics and nav, logged as one FA_DET_HASH line. scripts/android-smoke.sh (FA_SMOKE_DET_HASH) compares it with
      # tools/cli/tests/determinism_expected.txt, the committed values. The emulator is x86_64.
      - name: Add the determinism probe (replay hashes)
        run: |
          cp tools/cli/tests/determinism_probe.js /tmp/ci-game/scripts/determinism_probe.js
          python3 - <<'PY'
          import json
          path = "/tmp/ci-game/scenes/main.scene.json"
          with open(path) as f:
              scene = json.load(f)
          scene["entities"].append({"id": "detProbe", "name": "Determinism probe", "components": {"Script": {"path": "scripts/determinism_probe.js"}}})
          with open(path, "w") as f:
              json.dump(scene, f, indent=2)
          PY

      # Writes the Gradle project and runs ./gradlew assembleDebug in it (source mode: the engine is compiled from this
      # checkout for both ABIs); the APK lands next to the project as <slug>-debug.apk. FA_CI_PLUGINS (job env) is still
      # set: the export copies the plugin's android/ module into the project (plugins/example).
      - name: Export the game and build the debug APK
        run: |
          build/tools/tools/cli/factoria export /tmp/ci-game --platform android --out /tmp/ci-out
          ls -la /tmp/ci-out/ci-game-android

      - name: Trim ccache to what this build used (see the linux job)
        if: ${{ !cancelled() }}
        run: ccache --evict-older-than 7200s

      # Saved even when the tests fail (see the linux job).
      - name: Save ccache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-apk-${{ github.run_id }}

      # The emulator job below runs on x86_64, so the APK must carry that ABI next to arm64-v8a (docs/MOBILE.md). The
      # plugin's libraries are in the APK for both, and its Java class is in the dex (the manifest has hasCode="true").
      - name: Check the APK contains the native libraries for both ABIs and the plugin's Java class
        run: |
          unzip -l /tmp/ci-out/ci-game-android/ci-game-debug.apk | tee /tmp/apk-contents.txt
          grep -q 'lib/arm64-v8a/libfactoria_player.so' /tmp/apk-contents.txt
          grep -q 'lib/x86_64/libfactoria_player.so' /tmp/apk-contents.txt
          grep -q 'assets/factoria.json' /tmp/apk-contents.txt
          grep -q 'lib/arm64-v8a/libexample.so' /tmp/apk-contents.txt
          grep -q 'lib/x86_64/libexample.so' /tmp/apk-contents.txt
          grep -q 'android:hasCode="true"' /tmp/ci-out/ci-game-android/app/src/main/AndroidManifest.xml
          unzip -p /tmp/ci-out/ci-game-android/ci-game-debug.apk 'classes*.dex' > /tmp/apk-classes.dex
          grep -aq 'Lfactoria/plugin/example/Plugin;' /tmp/apk-classes.dex

      # The Google Play backend: its C bridge for both ABIs, its Java class and the three Google libraries in the dex, the Play Games
      # id in the app's resources, and the manifest merged: the Play Games meta-data in, the library's auto-start provider out.
      - name: Check the APK carries the Google Play backend
        run: |
          grep -q 'lib/arm64-v8a/libgoogleplay.so' /tmp/apk-contents.txt
          grep -q 'lib/x86_64/libgoogleplay.so' /tmp/apk-contents.txt
          grep -aq 'Lfactoria/plugin/googleplay/Backend;' /tmp/apk-classes.dex
          grep -aq 'Lcom/android/billingclient/api/BillingClient;' /tmp/apk-classes.dex
          grep -aq 'Lcom/google/android/gms/games/PlayGames;' /tmp/apk-classes.dex
          grep -aq 'Lcom/google/android/play/core/integrity/IntegrityManagerFactory;' /tmp/apk-classes.dex
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          aapt2="$sdk/build-tools/35.0.0/aapt2"
          apk=/tmp/ci-out/ci-game-android/ci-game-debug.apk
          "$aapt2" dump xmltree --file AndroidManifest.xml "$apk" | tee /tmp/apk-manifest.txt
          grep -q 'com.google.android.gms.games.APP_ID' /tmp/apk-manifest.txt
          if grep -q 'PlayGamesInitProvider' /tmp/apk-manifest.txt; then echo "the Play Games auto-start provider is still in the manifest"; exit 1; fi
          "$aapt2" dump resources "$apk" | grep -A1 'game_services_project_id' | grep '123456789012' >/dev/null

      # The AdMob backend: its C bridge for both ABIs, its Java class and the Mobile Ads SDK and UMP in the dex, and the manifest merged
      # with Google's sample app id, the test flag and the audience that the export wrote.
      - name: Check the APK carries the AdMob backend
        run: |
          grep -q 'lib/arm64-v8a/libadmob.so' /tmp/apk-contents.txt
          grep -q 'lib/x86_64/libadmob.so' /tmp/apk-contents.txt
          grep -aq 'Lfactoria/plugin/admob/Backend;' /tmp/apk-classes.dex
          grep -aq 'Lcom/google/android/gms/ads/MobileAds;' /tmp/apk-classes.dex
          grep -aq 'Lcom/google/android/ump/UserMessagingPlatform;' /tmp/apk-classes.dex
          grep -q 'com.google.android.gms.ads.APPLICATION_ID' /tmp/apk-manifest.txt
          grep -q 'ca-app-pub-3940256099942544~3347511713' /tmp/apk-manifest.txt
          grep -q 'factoria.ads.test' /tmp/apk-manifest.txt
          grep -q 'factoria.ads.audience' /tmp/apk-manifest.txt

      - name: Upload the debug APK for the emulator job
        uses: actions/upload-artifact@v4
        with:
          name: ci-game-debug-apk
          path: /tmp/ci-out/ci-game-android/ci-game-debug.apk
          if-no-files-found: error
          retention-days: 2

  # Android on a virtual device: boot an x86_64 emulator, install the APK of the job above, start it and assert that the
  # process stays alive, the player logged "player: 60 frames rendered", an audio stream runs, a tap reaches the player,
  # the app survives HOME and coming back and a font-size change, nothing crashed, the display shows a picture, and the
  # game comes back in a new process after a relaunch it cannot opt out of (`am update-appinfo`)
  # (scripts/android-smoke.sh; it waits for the system to be ready, no fixed sleep). Needs KVM, which GitHub's Linux
  # runners offer once the udev rule below is set. There is no arm64 emulator job: no hosted runner can run one
  # (docs/MOBILE.md).
  android-emulator:
    name: Android emulator (API 34 x86_64, run the APK)
    needs: android-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ci-game-debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # FA_SMOKE_EXPECT: what the game's script logs when it calls its native plugin (tools/cli/tests/plugin_probe.js):
      # the sum computed by the plugin's Java class through JNI, and the plugin's command; and what the Google Play backend
      # answers (tools/cli/tests/googleplay_probe.js). This image has no Google Play services, so Play Games sign-in
      # and Play Integrity are refused with `unavailable` by the Java code, and the status says so; and what the AdMob backend
      # answers (tools/cli/tests/admob_probe.js): it runs as the ads backend next to Google Play, with the manifest's test app id.
      # FA_SMOKE_BACK: the line tools/cli/tests/mobile_probe.js logs when its input.onBack handler consumes the Back button; the
      # smoke test sends `adb shell input keyevent KEYCODE_BACK` and needs that line once more, with the game still running.
      - name: Run the APK in the emulator (smoke test)
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          FA_SMOKE_BACK: probe back=consumed
          FA_SMOKE_DET_HASH: 1
          FA_SMOKE_EXPECT: |
            probe safearea=
            probe vibrate=sent
            probe add=3
            probe info=.*"plugin":"example"
            Google Play backend ready
            probe backend=googleplay
            probe services=.*"purchases".*"overlay".*"integrity".*"achievements".*"leaderboards".*"cloudSave"
            probe playgames=true id=123456789012
            probe playservices=false
            probe signin=unavailable
            probe integrity=unavailable
            AdMob backend ready
            probe adsbackend=admob store=googleplay
            probe admob test=true audience=general appId=ca-app-pub-3940256099942544~3347511713
            probe underage=ok
        with:
          api-level: 34
          arch: x86_64
          target: default
          script: bash scripts/android-smoke.sh apk/ci-game-debug.apk dev.factoria.cigame 120 build/android-smoke

      - name: Upload logcat, screenshot and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke
          path: build/android-smoke
          if-no-files-found: ignore
          retention-days: 7

  # libFuzzer with AddressSanitizer and UBSan (Clang, -DFA_FUZZ=ON) on the data-format targets of tools/fuzz: each one runs
  # for about a minute over a copy of its corpus (tools/fuzz/run.sh). A crash, a sanitizer report or a timeout fails the job
  # and its input is uploaded. The ordinary builds replay the same corpus as the ctests labelled `fuzz` (docs/BUILDING.md,
  # "Fuzzing"). Nothing here runs the editor, a GPU or the tests: only the fuzz programs are built.
  linux-fuzz:
    name: Fuzz (Clang, libFuzzer, ASan + UBSan)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90  # a cold-ccache build of the engine and the tools with sanitizers, then about a minute per target
    env:
      FA_FUZZ_SECONDS: '60'
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: ./scripts/bootstrap-linux.sh

      # libFuzzer's runtime is in the compiler-rt package of the compiler's version.
      - name: Install Clang and libFuzzer
        run: |
          sudo apt-get install -y clang
          ver=$(clang --version | sed -n 's/.*version \([0-9]*\)\..*/\1/p' | head -n 1)
          sudo apt-get install -y "libclang-rt-${ver}-dev"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-linux-fuzz-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-linux-fuzz-

      - name: Configure and build the fuzz targets
        run: |
          ccache --zero-stats
          cmake -S . -B build/fuzz -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DFA_FUZZ=ON -DFA_WARNINGS_AS_ERRORS=ON -DFA_BUILD_EDITOR=OFF -DFA_BUILD_TESTS=OFF
          cmake --build build/fuzz --target fa_fuzz_all
          ccache --show-stats --verbose

      - name: Trim ccache to what this build used
        if: ${{ !cancelled() }}
        run: ccache --evict-older-than 7200s

      - name: Save ccache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-linux-fuzz-${{ github.run_id }}

      # A random run of a minute per target finds a different input each time, so a finding there is usually not caused by this
      # change: it must not block unrelated pull requests. A finding does not fail the step and the next one makes the result
      # visible (a warning annotation and the job summary). What does block: the build of the targets above, and the corpus
      # replay (ctest label `fuzz`, run by the normal jobs), which holds every input that ever failed.
      # tools/fuzz/run.sh exits 0 (nothing found), 1 (a crash, timeout, out-of-memory or sanitizer report: findings) or 2 (the
      # run itself failed: no fuzz program, an unknown target, a program that failed without leaving an input). Only exit 1 is
      # soft; an exit 2 fails the job, because a run that did not run would otherwise look like a run that found nothing.
      - name: Fuzz every target
        id: fuzz
        run: |
          set +e
          tools/fuzz/run.sh build/fuzz "$FA_FUZZ_SECONDS"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 1 ]; then exit 0; fi
          exit "$status"

      - name: Say that the fuzz run found something
        if: steps.fuzz.outputs.status == '1'
        run: |
          echo "::warning title=Fuzzing found a crash::The random fuzz run failed. It does not block this pull request, but the input is a real bug: download the artifact fuzz-crashes, reproduce it with build/fuzz/tools/fuzz/fa_fuzz_<target> <file>, fix it and add the input to tools/fuzz/corpus/<target>/ (docs/BUILDING.md, Fuzzing)."
          {
            echo "### Fuzzing found something"
            echo
            echo "The random run of \`linux-fuzz\` found a crash. This job stays green so that unrelated pull requests are not blocked, but each file in the artifact \`fuzz-crashes\` is an input that crashes the engine:"
            echo
            echo '```'
            ls build/fuzz/fuzz-crashes
            echo '```'
            echo
            echo "Reproduce with \`fa_fuzz_<target> <file>\` from a build with \`-DFA_FUZZ=ON\`, fix the bug, and copy the input into \`tools/fuzz/corpus/<target>/\` so the corpus replay keeps it fixed."
          } >> "$GITHUB_STEP_SUMMARY"

      # crash-*, timeout-*, oom-* and leak-* files: `build/fuzz/tools/fuzz/fa_fuzz_<target> <file>` reproduces one; to keep it,
      # copy it into tools/fuzz/corpus/<target>/ (docs/BUILDING.md, "Fuzzing").
      - name: Upload the inputs that failed
        if: failure() || steps.fuzz.outputs.status == '1'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: build/fuzz/fuzz-crashes
          if-no-files-found: ignore
          retention-days: 14

  # Source coverage per module (llvm-cov, docs/BUILDING.md "Coverage"): the Debug suite with the editor autotest under Xvfb.
  # Informative: NOT in the `needs` of `result`, so a failing test or a lower number here never blocks a merge (the `linux`
  # job already gates the tests; this one runs them again instrumented, and instrumented Debug runs are slow).
  coverage:
    name: Coverage (Clang, llvm-cov)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: ./scripts/bootstrap-linux.sh

      - name: Install Clang and LLVM tools
        run: |
          sudo apt-get install -y clang
          ver=$(clang --version | sed -n 's/.*version \([0-9]*\)\..*/\1/p' | head -n 1)
          sudo apt-get install -y "llvm-${ver}"
          echo "LLVM_COV=llvm-cov-${ver}" >> "$GITHUB_ENV"
          echo "LLVM_PROFDATA=llvm-profdata-${ver}" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-linux-coverage-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-linux-coverage-

      - name: Configure and build (Clang, Debug, FA_COVERAGE)
        run: |
          ccache --zero-stats
          # Instrumented test executables take gigabytes each to link: four links at once ran the runner out of memory and
          # GitHub lost it twice (M93), so links go through a pool of two; compiles keep every core.
          cmake -S . -B build/coverage -G Ninja -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DFA_COVERAGE=ON \
              -DCMAKE_JOB_POOLS=link=2 -DCMAKE_JOB_POOL_LINK=link
          cmake --build build/coverage
          ccache --show-stats --verbose

      - name: Trim ccache to what this build used
        if: ${{ !cancelled() }}
        run: ccache --evict-older-than 7200s

      - name: Save ccache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-linux-coverage-${{ github.run_id }}

      - name: Install the shader compiler (factoria setup shaders)
        run: |
          cli=$(find build/coverage/tools/cli -maxdepth 2 -type f -name factoria | head -n 1)
          test -n "$cli" || { echo "::error::factoria was not built under build/coverage/tools/cli"; exit 1; }
          "$cli" setup shaders

      # Instrumented Debug on llvmpipe is slow: two tests at a time, the `perf` ones (Release budgets) left out, and every
      # TIMEOUT multiplied by 3 (FA_COVERAGE_TIMEOUT_SCALE, cmake/FactoriaCoverage.cmake; ctest has no multiplier of its own).
      # A test killed by a timeout writes no profile and turns this job red, but the report below is still made from the rest.
      - name: Test under Xvfb (Mesa llvmpipe)
        run: xvfb-run -a -s "-screen 0 1280x720x24" ctest --test-dir build/coverage --parallel 2 -LE perf --output-on-failure

      - name: Size of the raw profiles
        if: ${{ !cancelled() }}
        run: |
          df -h .
          du -sh build/coverage/coverage/raw

      - name: Coverage report
        if: ${{ !cancelled() }}
        run: scripts/coverage-report.sh build/coverage build/coverage-report

      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build/coverage-report/html
            build/coverage-report/coverage.md
            build/coverage-report/coverage.json
          if-no-files-found: warn
          retention-days: 14

  # Formatting and bug-finding lint (docs/BUILDING.md, "Formatting and lint"). Cheap: nothing is compiled, CMake only
  # writes compile_commands.json for clang-tidy.
  lint:
    name: Lint (format, clang-tidy)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # `all`: every C/C++ file (the code base was formatted in 0.26.0, .git-blame-ignore-revs); `changed`: only the
      # files this change touches (the base of the pull request, or the commit before a push).
      FORMAT_SCOPE: all
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the merge base of the diff

      - name: Pick the base of the diff
        id: base
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A tag, "Run workflow" or a push without a usable base (new branch: all zeros) compares with the first parent.
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=HEAD~1; fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Diff base: $BASE"

      # The pinned clang-format and clang-tidy come from scripts/lint-tools.sh (pip wheels in build/lint-venv).
      - name: Format check
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          if [[ "$FORMAT_SCOPE" == "all" ]]; then ./scripts/format.sh --check; else ./scripts/format.sh --check --changed "$BASE"; fi

      - name: Install build dependencies (for the CMake configure)
        run: ./scripts/bootstrap-linux.sh

      - name: clang-tidy on the changed sources
        env:
          BASE: ${{ steps.base.outputs.base }}
          FA_TIDY_JOBS: 4
        run: ./scripts/tidy-changed.sh "$BASE"

  # The one check main's branch protection requires: every job that ran passed (a skipped job had nothing to check).
  result:
    name: CI result
    if: always()
    needs: [changes, lint, linux, linux-asan, linux-tsan, linux-fuzz, linux-sniper, windows, macos, bench, ios-build, ios, android, android-apk, android-emulator, web]
    runs-on: ubuntu-24.04
    permissions:
      actions: write  # gh cache delete
    steps:
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

      # Every run saves one ccache per job (the key ends in the run id). Keep only the newest of each on this branch or
      # pull request, so the repository's 10 GB do not push out main's, which every pull request starts from. A pull
      # request from a fork cannot delete caches: then nothing is deleted.
      - name: Delete the older ccaches of this branch
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --ref "$GITHUB_REF" --key ccache- --limit 100 --json id,key,createdAt \
              --jq 'group_by(.key | sub("-[0-9]+$"; "")) | map(sort_by(.createdAt) | reverse | .[1:][]) | .[].id' |
              xargs -r -n1 gh cache delete
