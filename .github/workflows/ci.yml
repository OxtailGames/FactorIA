# Continuous integration. Every job uses the same CMake presets as local builds
# (CMakePresets.json, ./scripts/build.sh), so a green run means the local
# commands work on that platform too.
name: CI

# All five platforms on GitHub-hosted runners (standard hosted runners are free
# for public repositories). Runs once per change: on pull requests (every push to
# a PR branch) and on pushes to main. Pushing to a branch without a PR does not
# trigger a run, so PR branches are not built twice; use "Run workflow"
# (workflow_dispatch) for those. The same checks can run locally with
# ./scripts/ci-local.sh (see docs/BUILDING.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Keep only the newest run per branch or pull request.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Linux: GCC + Ninja. Tests run under Xvfb with Mesa llvmpipe, so headless
  # GPU code gets a software OpenGL/EGL renderer.
  linux:
    name: Linux (Ubuntu 24.04, GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Same package list as local development (see scripts/bootstrap-linux.sh).
      - name: Install build dependencies
        run: ./scripts/bootstrap-linux.sh

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-linux-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-linux-

      - name: Configure and build (linux-release)
        run: |
          cmake --preset linux-release
          cmake --build --preset linux-release

      - name: Test under Xvfb (Mesa llvmpipe)
        run: xvfb-run -a -s "-screen 0 1280x720x24" ctest --preset linux-release

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-output
          path: |
            build/**/Testing/**
            build/**/test-output/**/*.png
          if-no-files-found: ignore
          retention-days: 7

  # Windows: MSVC through the Visual Studio 2022 generator. Headless GPU code
  # uses the D3D11 software adapter (WARP).
  # One command per step, so a failing command fails the step (PowerShell).
  windows:
    name: Windows (Visual Studio 2022, MSVC)
    runs-on: windows-2022  # the preset uses the "Visual Studio 17 2022" generator; windows-latest now ships VS 2026
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure (windows-release)
        run: cmake --preset windows-release

      - name: Build (windows-release)
        run: cmake --build --preset windows-release

      - name: Test (windows-release)
        run: ctest --preset windows-release

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-output
          path: |
            build/**/Testing/**
            build/**/test-output/**/*.png
          if-no-files-found: ignore
          retention-days: 7

  # macOS: Apple Clang + Ninja. GPU-labelled tests (Metal) are excluded with
  # -LE gpu while hosted runners cannot run them; drop the flag once they can.
  macos:
    name: macOS (Apple Clang, Ninja)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja and ccache
        run: brew install ninja ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-macos-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-macos-

      - name: Configure and build (macos-release)
        run: |
          cmake --preset macos-release
          cmake --build --preset macos-release

      - name: Test (macos-release, GPU tests excluded)
        run: ctest --preset macos-release -LE gpu

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-output
          path: |
            build/**/Testing/**
            build/**/test-output/**/*.png
          if-no-files-found: ignore
          retention-days: 7

  # iOS: build the player for the simulator with Xcode, then run it on an iOS Simulator. Code signing is off for the
  # build (the simulator does not need it; the smoke script signs ad hoc). No ccache here: launcher support with the
  # Xcode generator is not reliable.
  ios:
    name: iOS Simulator (Xcode)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # FA_GAME_PROJECT_DIR exercises the game-copy step (platforms/common/copy_game.cmake) and the Info.plist template.
      - name: Configure (ios-simulator, with a bundled demo game)
        run: cmake --preset ios-simulator -DFA_GAME_PROJECT_DIR="$PWD/templates/2d-platformer" -DFA_GAME_BUNDLE_ID=dev.factoria.ci -DFA_GAME_NAME="CI Game"

      - name: Build factoria_player (ios-simulator)
        run: cmake --build --preset ios-simulator --target factoria_player -- -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO

      - name: Check the app bundle contains the game and a valid Info.plist
        run: |
          app=$(find build/ios-simulator -name factoria_player.app -type d | head -n 1)
          test -n "$app"
          test -f "$app/game/factoria.json"
          test ! -e "$app/game/ENGINE_FEEDBACK.json"
          plutil -lint "$app/Info.plist"

      # Run the app: boot an iPhone simulator, install and launch the .app with its console captured, and assert that
      # the process stays alive, the player logged "player: 60 frames rendered", nothing crashed and the display shows
      # a picture (scripts/ios-smoke.sh; macOS runners are Apple Silicon, so the arm64 simulator slice runs natively).
      - name: Run the app in the iOS Simulator (smoke test)
        run: |
          app=$(find "$PWD/build/ios-simulator" -name factoria_player.app -type d | head -n 1)
          ./scripts/ios-smoke.sh "$app" dev.factoria.ci 90 build/ios-smoke

      - name: Upload simulator logs, screenshot and crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke
          path: build/ios-smoke
          if-no-files-found: ignore
          retention-days: 7

  # Android: arm64-v8a player library with the preinstalled NDK on the runner.
  android:
    name: Android arm64 (NDK, Ninja)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja and ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-android-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-android-

      # The runner image preinstalls several NDKs; the preset reads ANDROID_NDK_HOME.
      - name: Select the preinstalled NDK
        run: |
          test -f "$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Configure and build factoria_player (android-arm64)
        run: |
          cmake --preset android-arm64
          cmake --build --preset android-arm64 --target factoria_player

      # The player must export ANativeActivity_onCreate (sokol_app) or NativeActivity cannot start it.
      - name: Check the entry points of libfactoria_player.so
        run: |
          nm="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$nm" -D --defined-only build/android-arm64/player/libfactoria_player.so | tee /tmp/symbols.txt
          grep -q ANativeActivity_onCreate /tmp/symbols.txt

  # Android end to end: export a game with `factoria export` and build the APK with Gradle
  # (AGP 8.5 + NDK + CMake 3.31 from the SDK). Slow: builds the host tools and the engine for two ABIs.
  android-apk:
    name: Android APK (factoria export + Gradle)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: ./scripts/bootstrap-linux.sh

      - name: Build the factoria CLI (no editor, no tests)
        run: |
          cmake -S . -B build/tools -G Ninja -DCMAKE_BUILD_TYPE=Release -DFA_BUILD_EDITOR=OFF -DFA_BUILD_TESTS=OFF
          cmake --build build/tools --target factoria

      - name: Create and export a game
        run: |
          build/tools/tools/cli/factoria new /tmp/ci-game --template 2d-platformer --name "CI Game" --id dev.factoria.cigame
          build/tools/tools/cli/factoria export /tmp/ci-game --platform android --out /tmp/ci-out
          ls /tmp/ci-out/ci-game-android

      - name: Install SDK packages (CMake 3.31, NDK, platform 34)
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" "cmake;3.31.6" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018"
          echo "sdk.dir=$sdk" > /tmp/ci-out/ci-game-android/local.properties

      - name: Build the debug APK
        working-directory: /tmp/ci-out/ci-game-android
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --no-daemon
          ls -la app/build/outputs/apk/debug/

      # The emulator job below runs on x86_64, so the APK must carry that ABI next to arm64-v8a (docs/MOBILE.md).
      - name: Check the APK contains the native library for both ABIs
        run: |
          unzip -l /tmp/ci-out/ci-game-android/app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk-contents.txt
          grep -q 'lib/arm64-v8a/libfactoria_player.so' /tmp/apk-contents.txt
          grep -q 'lib/x86_64/libfactoria_player.so' /tmp/apk-contents.txt
          grep -q 'assets/factoria.json' /tmp/apk-contents.txt

      - name: Upload the debug APK for the emulator job
        uses: actions/upload-artifact@v4
        with:
          name: ci-game-debug-apk
          path: /tmp/ci-out/ci-game-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 2

  # Android on a real (virtual) device: boot an x86_64 emulator, install the APK of the job above, start it and assert
  # that the process stays alive, the player logged "player: 60 frames rendered", nothing crashed and the display shows
  # a picture (scripts/android-smoke.sh). Needs KVM, which GitHub's Linux runners offer once the udev rule below is set.
  android-emulator:
    name: Android emulator (API 34 x86_64, run the APK)
    needs: android-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ci-game-debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the APK in the emulator (smoke test)
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: default
          script: bash scripts/android-smoke.sh apk/app-debug.apk dev.factoria.cigame 120 build/android-smoke

      - name: Upload logcat, screenshot and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke
          path: build/android-smoke
          if-no-files-found: ignore
          retention-days: 7
