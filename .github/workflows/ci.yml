# Day-to-day CI on the project's SELF-HOSTED runner (no GitHub Actions minutes).
#
# One job runs scripts/ci-local.sh on the runner machine. The script detects the
# host and runs every job that machine supports (Linux: build + ctest, Windows
# cross-build + Wine tests if MinGW/Wine are installed; Windows: MSVC build +
# ctest via scripts/build.ps1; macOS: macOS build + ctest and the iOS Simulator
# app; Android: when ANDROID_NDK_HOME is set). Jobs the host cannot run are
# reported as skipped in the summary. See docs/BUILDING.md, "Continuous integration".
#
# The all-platform cloud matrix lives in ci-github-hosted.yml (manual only).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# One run at a time per branch on the runner; a newer push replaces an older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  local-ci:
    name: Local CI (self-hosted)
    # Only code from this repository runs on the self-hosted machine: pull
    # requests from forks are never executed there.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Run scripts/ci-local.sh
        shell: bash
        run: ./scripts/ci-local.sh

      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: build/ci-logs/
          retention-days: 5
          if-no-files-found: ignore
