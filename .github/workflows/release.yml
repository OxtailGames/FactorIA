# Release packages: build the developer tools with the release presets and package them as a download that works
# without dev tools (docs/GETTING_STARTED.md, "Download"). Docs, templates and schemas are embedded in factoria, and
# the C++ runtime is linked statically on Windows, so the package needs nothing from the repository.
#
# A `v*` tag publishes the packages as a GitHub Release; "Run workflow" (workflow_dispatch) keeps them as workflow
# artifacts, and so does a pull request that changes this file. Each package is smoke-tested from a folder outside the
# checkout before it is uploaded.
#
# Updates: the packages are built with FA_UPDATE_REPO set to this repository, so their editor offers each newer
# release when it opens, with the release notes (edit them on the release page), and installs it in place
# (tools/editor/src/update.cpp). It looks for these exact names: FactorIA-<os>.zip / .tar.gz with one FactorIA/
# folder inside. The names carry no version, so releases/latest/download/FactorIA-<os>.zip always is the newest.
# Bump project(VERSION) in CMakeLists.txt before tagging: the tag must match `factoria version`.
#
# A release holds (docs/GETTING_STARTED.md, "Download"):
#   FactorIA-windows-x64.zip          the Windows package; the editor's updater uses it, also for an installed copy
#   FactorIA-windows-x64-setup.exe    installer of the same files (platforms/windows/FactorIA.iss): per user, no admin
#                                     prompt, Start menu entry, folder on the user PATH
#   FactorIA-macos-universal.tar.gz   arm64 + x86_64 in one binary; the editor's updater uses it
#   FactorIA-macos-arm64.tar.gz       the same file again, only because editors up to 0.1.2 look for this name (the
#                                     `publish` job copies it). Drop it once nobody runs those editors, together with
#                                     the note in update_package_name() (tools/editor/src/update.cpp).
#   FactorIA-linux-x64.tar.gz         the Linux package; the editor's updater uses it
#   FactorIA-linux-x64.AppImage       the same files as one file (scripts/package-appimage.sh); does not update itself
#
# Signing: with the repository secrets set, the executables are signed on Windows (signtool; the installer too) and
# signed + notarized on macOS (codesign, notarytool). Without them these steps only print a notice and the packages
# are unsigned. Which secrets, what to buy: docs/BUILDING.md, "Releasing".
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-x64
            runner: windows-2022  # the preset uses the "Visual Studio 17 2022" generator
            preset: windows-release
            cfg: /Release  # Visual Studio is a multi-config generator
            exe: .exe
            ccache: ~\AppData\Local\ccache
            ccache-key: windows
          - os: macos-universal
            runner: macos-latest
            preset: macos-release
            cmake-args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"  # one binary for Apple Silicon and Intel Macs
            ccache: ~/Library/Caches/ccache  # ccache skips two-architecture compiles: this build is uncached
            ccache-key: macos
          - os: linux-x64
            runner: ubuntu-24.04
            preset: linux-release
            ccache: ~/.cache/ccache
            ccache-key: linux
            wrap: xvfb-run -a  # headless tests on Mesa llvmpipe, as in ci.yml
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/bootstrap-linux.sh

      - name: Install Ninja and ccache (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ccache

      # As in ci.yml: MSBuild runs ccache as cl.exe (CLToolPath), one source per call in parallel (UseMultiToolTask).
      - name: Install ccache (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ccache.zip" https://github.com/ccache/ccache/releases/download/v4.14.1/ccache-4.14.1-windows-x86_64.zip
          unzip -q "$RUNNER_TEMP/ccache.zip" -d "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/ccache-cl"
          cp "$RUNNER_TEMP/ccache-4.14.1-windows-x86_64/ccache.exe" "$RUNNER_TEMP/ccache-cl/cl.exe"
          { echo "CLToolPath=$RUNNER_TEMP\ccache-cl"; echo "UseMultiToolTask=true"; } >> "$GITHUB_ENV"

      # The CI runs on main fill these caches (ci.yml); a release only reads them.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.ccache }}
          key: ccache-${{ runner.os }}-${{ matrix.ccache-key }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-${{ matrix.ccache-key }}-

      - name: Configure (${{ matrix.preset }}, no tests)
        run: cmake --preset ${{ matrix.preset }} -DFA_BUILD_TESTS=OFF -DFA_UPDATE_REPO=${{ github.repository }} ${{ matrix.cmake-args }}

      - name: Build (${{ matrix.preset }})
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Check the universal binaries (macOS)
        if: runner.os == 'macOS'
        run: |
          for f in "build/${{ matrix.preset }}/tools/cli/factoria" "build/${{ matrix.preset }}/player/factoria_player"; do
            archs="$(lipo -archs "$f")"
            echo "$f: $archs"
            [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]] || { echo "::error::$f is not universal ($archs)"; exit 1; }
          done

      # Code signing (docs/BUILDING.md, "Releasing"). Each script prints a notice and does nothing without its secrets.
      # The signed files are what the packages and the installer are made of, so this comes before "Package".
      - name: Sign executables (Windows)
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          bin="build/${{ matrix.preset }}/tools/cli${{ matrix.cfg }}"
          ./scripts/sign-windows.sh "$bin/factoria.exe" "$bin/FactorIA-Editor.exe" "build/${{ matrix.preset }}/player${{ matrix.cfg }}/factoria_player.exe"

      - name: Sign and notarize executables (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/sign-macos.sh "build/${{ matrix.preset }}/tools/cli/factoria" "build/${{ matrix.preset }}/player/factoria_player"

      # FactorIA-<os>.zip (.tar.gz on macOS and Linux) with one folder, FactorIA/, inside.
      - name: Package
        run: |
          name="FactorIA-${{ matrix.os }}"
          bin="build/${{ matrix.preset }}/tools/cli${{ matrix.cfg }}"
          mkdir -p dist/FactorIA
          cp "$bin/factoria${{ matrix.exe }}" "build/${{ matrix.preset }}/player${{ matrix.cfg }}/factoria_player${{ matrix.exe }}" README.md dist/FactorIA/
          if [[ -f LICENSE ]]; then cp LICENSE dist/FactorIA/; fi
          cd dist
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp "../$bin/FactorIA-Editor.exe" FactorIA/
            cmake -E tar cf "$name.zip" --format=zip FactorIA
            echo "PACKAGE=dist/$name.zip" >> "$GITHUB_ENV"
          else
            cmake -E tar czf "$name.tar.gz" FactorIA
            echo "PACKAGE=dist/$name.tar.gz" >> "$GITHUB_ENV"
          fi
          echo "PACKAGE_NAME=$name" >> "$GITHUB_ENV"  # PACKAGE is relative: upload-artifact cannot read MSYS paths (/d/a/...)

      # Unpack in a temp folder outside the checkout and use only what the package contains.
      - name: Smoke-test the package
        run: |
          tmp="${RUNNER_TEMP//\\//}/smoke"
          mkdir -p "$tmp" && cd "$tmp"
          cmake -E tar xf "$GITHUB_WORKSPACE/$PACKAGE"
          fa="$tmp/FactorIA/factoria${{ matrix.exe }}"
          version="$("$fa" version | tr -d '\r')"
          echo "$version"
          # The editor offers a release when its tag is newer than `factoria version`: they must agree.
          if [[ "$GITHUB_REF" == refs/tags/v* && "$version" != "factoria ${GITHUB_REF_NAME#v}" ]]; then
            echo "::error::'$version' does not match the tag $GITHUB_REF_NAME: set project(VERSION) in CMakeLists.txt"
            exit 1
          fi
          "$fa" new "$tmp/g" --template 2d-platformer
          ${{ matrix.wrap }} "$fa" test "$tmp/g"
          "$fa" export "$tmp/g" --out "$tmp/export"
          ls "$tmp/export"/*

      # The runner is Apple Silicon: the Intel half runs through Rosetta, installed here when the image lacks it.
      - name: Smoke-test the Intel half (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license > /dev/null 2>&1 || true
          if ! arch -x86_64 /usr/bin/true 2> /dev/null; then
            echo "::warning::Rosetta is not available on this runner: the x86_64 half was not run"
            exit 0
          fi
          tmp="$RUNNER_TEMP/smoke-intel"
          mkdir -p "$tmp" && cd "$tmp"
          cmake -E tar xf "$GITHUB_WORKSPACE/$PACKAGE"
          arch -x86_64 FactorIA/factoria version
          arch -x86_64 FactorIA/factoria new g --template 2d-platformer
          arch -x86_64 FactorIA/factoria test g

      # FactorIA-windows-x64-setup.exe wraps the same FactorIA/ folder as the zip (signed exes inside). Inno Setup is on
      # the runner image; the fallback installs the same version.
      - name: Build the installer (Windows)
        if: runner.os == 'Windows'
        env:
          MSYS2_ARG_CONV_EXCL: '*'  # ISCC's /O<dir> is not a path
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [[ -f "$iscc" ]] || choco install innosetup --version=6.7.1 -y --no-progress
          # platforms/windows/FactorIA.iss reads both from the environment.
          export FA_INSTALLER_VERSION="$(dist/FactorIA/factoria.exe version | tr -d '\r' | sed 's/^factoria //')"
          export FA_INSTALLER_SOURCE="$(cygpath -w "$PWD/dist/FactorIA")"
          echo "Installer for FactorIA $FA_INSTALLER_VERSION"
          "$iscc" "/O$(cygpath -w "$PWD/dist")" "$(cygpath -w platforms/windows/FactorIA.iss)"
          ./scripts/sign-windows.sh dist/FactorIA-windows-x64-setup.exe

      # Installs for the current user the way a user would (silently), finds factoria through the user PATH that the
      # installer wrote, installs again (no second PATH entry), then uninstalls: PATH entry, shortcut, files and folder
      # must go, also what the editor's updater leaves behind (.update\, *.old).
      - name: Smoke-test the installer (Windows)
        if: runner.os == 'Windows'
        env:
          MSYS2_ARG_CONV_EXCL: '*'  # Inno's /VERYSILENT and the like are not paths
        run: |
          fail() { echo "::error::$*"; exit 1; }
          user_path() { powershell -NoProfile -Command "[Environment]::GetEnvironmentVariable('Path','User')" | tr -d '\r' | tr ';' '\n'; }
          setup="dist/FactorIA-windows-x64-setup.exe"
          log="$RUNNER_TEMP/setup.log"
          dir_win="$(cygpath -w "$LOCALAPPDATA")\\Programs\\FactorIA"
          dir="$(cygpath -u "$dir_win")"
          lnk="$(cygpath -u "$APPDATA")/Microsoft/Windows/Start Menu/Programs/FactorIA Editor.lnk"

          for pass in 1 2; do
            "$setup" /VERYSILENT /SUPPRESSMSGBOXES /CURRENTUSER /NORESTART "/LOG=$(cygpath -w "$log")" || { cat "$log"; fail "the installer failed (pass $pass)"; }
          done
          for f in factoria.exe factoria_player.exe FactorIA-Editor.exe unins000.exe; do
            [[ -f "$dir/$f" ]] || { ls -la "$dir"; fail "$f is not in $dir_win"; }
          done
          [[ -f "$lnk" ]] || fail "no Start menu entry: $lnk"
          [[ "$(user_path | grep -Fxic -- "$dir_win")" == 1 ]] || { user_path; fail "$dir_win must be in the user PATH exactly once"; }

          # `factoria` from the installed copy, found through that PATH entry.
          export PATH="$dir:$PATH"
          [[ "$(command -v factoria)" == "$dir"/factoria* ]] || fail "factoria is not found through the PATH ($(command -v factoria))"
          tmp="${RUNNER_TEMP//\\//}/installed"
          mkdir -p "$tmp"
          factoria version
          factoria new "$tmp/g" --template 2d-platformer
          factoria test "$tmp/g"

          touch "$dir/factoria.exe.old"
          mkdir -p "$dir/.update" && touch "$dir/.update/x"
          "$dir/unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          for _ in $(seq 60); do [[ -e "$dir" ]] || break; sleep 1; done  # the uninstaller may hand over to a copy of itself
          [[ ! -e "$dir" ]] || { ls -la "$dir"; fail "the uninstaller left $dir_win behind"; }
          [[ ! -e "$lnk" ]] || fail "the uninstaller left the Start menu entry"
          [[ "$(user_path | grep -Fxic -- "$dir_win")" == 0 ]] || fail "the uninstaller left $dir_win in the user PATH"

      - name: Build the AppImage (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/package-appimage.sh dist/FactorIA dist/FactorIA-linux-x64.AppImage

      # No FUSE on the runner: --appimage-extract-and-run unpacks the image to a temp folder for each run.
      - name: Smoke-test the AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          tmp="$RUNNER_TEMP/appimage-smoke"
          mkdir -p "$tmp/bin"
          app="$PWD/dist/FactorIA-linux-x64.AppImage"
          run() { "$app" --appimage-extract-and-run "$@"; }
          fail() { echo "::error::$*"; exit 1; }

          run factoria version
          [[ "$(run version)" == "$(run factoria version)" ]] || fail "'version' and 'factoria version' differ"
          run new "$tmp/g" --template 2d-platformer
          xvfb-run -a "$app" --appimage-extract-and-run test "$tmp/g"
          run export "$tmp/g" --out "$tmp/export"  # finds factoria_player inside the image
          ls "$tmp/export"/*

          # Called as `factoria` (a symlink) it is the CLI: no arguments print the help...
          ln -s "$app" "$tmp/bin/factoria"
          help="$(xvfb-run -a "$tmp/bin/factoria" --appimage-extract-and-run)"
          grep -q "Usage:" <<< "$help" || fail "the factoria symlink did not print the CLI help"
          # ...and called by its own name with no arguments it opens the editor, which keeps running (timeout: 124).
          status=0
          timeout 20 xvfb-run -a "$app" --appimage-extract-and-run > "$tmp/editor.log" 2>&1 || status=$?
          cat "$tmp/editor.log"
          [[ "$status" == 124 ]] || fail "the AppImage without arguments should open the editor and stay open (exit $status)"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ env.PACKAGE }}
          if-no-files-found: error
          compression-level: 0  # already compressed

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: FactorIA-windows-x64-setup
          path: dist/FactorIA-windows-x64-setup.exe
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: FactorIA-linux-x64-AppImage
          path: dist/FactorIA-linux-x64.AppImage
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Editors up to 0.1.2 update from FactorIA-macos-arm64.tar.gz. The universal package is that very file (it runs on
      # Apple Silicon), so older installs keep updating. Drop this step once nobody runs those editors (see the header).
      - name: Keep the old macOS package name for older editors
        run: cp dist/FactorIA-macos-universal.tar.gz dist/FactorIA-macos-arm64.tar.gz

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "FactorIA $GITHUB_REF_NAME" --generate-notes
