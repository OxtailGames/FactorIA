            storage_buffer:
              slot: 1
              stage: compute
              size: 16
              align: 16
              struct_name: fa_src_buf
              inst_name: src
              inner_struct_name: src_item
              readonly: true
              glsl_binding_n: 1
          -
            texture:
              slot: 2
              stage: compute
              name: tex
              multisampled: false
              type: 2d
              sample_type: float
        samplers:
          -
            slot: 0
            stage: compute
            name: tex_smp
            sampler_type: filtering
        texture_sampler_pairs:
          -
            slot: 0
            stage: compute
            name: tex_tex_smp
            view_name: tex
            sampler_name: tex_smp
            view_slot: 2
            sampler_slot: 0
            glsl_name: tex_tex_smp
