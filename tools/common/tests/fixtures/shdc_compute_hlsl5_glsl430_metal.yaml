shaders:
  -
    slang: glsl430
    programs:
      -
        name: compute
        compute_func:
          path: out/m_fa_mat_compute_glsl430_compute.glsl
          is_binary: false
          entry_point: main
        uniform_blocks:
          -
            slot: 0
            stage: compute
            size: 32
            struct_name: fa_material
            inst_name: _42
            glsl_uniforms:
              -
                type: vec4
                array_count: 2
                offset: 0
                glsl_name: fa_material
        views:
          -
            storage_buffer:
              slot: 0
              stage: compute
              size: 16
              align: 16
              struct_name: fa_particles_buf
              inst_name: particles
              inner_struct_name: particles_item
              readonly: false
              glsl_binding_n: 0
