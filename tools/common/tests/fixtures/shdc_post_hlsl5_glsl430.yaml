shaders:
  -
    slang: glsl430
    programs:
      -
        name: post
        vertex_func:
          path: out/m_fa_mat_post_glsl430_vertex.glsl
          is_binary: false
          entry_point: main
        fragment_func:
          path: out/m_fa_mat_post_glsl430_fragment.glsl
          is_binary: false
          entry_point: main
        attrs:
          -
            slot: 0
            type: vec2
            base_type: Float
            glsl_name: pos
        uniform_blocks:
          -
            slot: 0
            stage: vertex
            size: 16
            struct_name: fa_post_vs_params
            inst_name: _51
            glsl_uniforms:
              -
                type: vec4
                array_count: 1
                offset: 0
                glsl_name: fa_post_vs_params
          -
            slot: 1
            stage: fragment
            size: 64
            struct_name: fa_post_params
            inst_name: _51
            glsl_uniforms:
              -
                type: vec4
                array_count: 4
                offset: 0
                glsl_name: fa_post_params
          -
            slot: 5
            stage: fragment
            size: 16
            struct_name: fa_material
            inst_name: _144
            glsl_uniforms:
              -
                type: vec4
                array_count: 1
                offset: 0
                glsl_name: fa_material
        views:
          -
            texture:
              slot: 0
              stage: fragment
              name: fa_scene
              multisampled: false
              type: 2d
              sample_type: float
        samplers:
          -
            slot: 0
            stage: fragment
            name: fa_scene_smp
            sampler_type: filtering
        texture_sampler_pairs:
          -
            slot: 0
            stage: fragment
            name: fa_scene_fa_scene_smp
            view_name: fa_scene
            sampler_name: fa_scene_smp
            view_slot: 0
            sampler_slot: 0
            glsl_name: fa_scene_fa_scene_smp
  -
    slang: hlsl5
    programs:
      -
        name: post
        vertex_func:
          path: out/m_fa_mat_post_hlsl5_vertex.hlsl
          is_binary: false
          entry_point: main
          d3d11_target: vs_5_0
        fragment_func:
          path: out/m_fa_mat_post_hlsl5_fragment.hlsl
          is_binary: false
          entry_point: main
          d3d11_target: ps_5_0
        attrs:
          -
            slot: 0
            type: vec2
            base_type: Float
            hlsl_sem_name: TEXCOORD
            hlsl_sem_index: 0
        uniform_blocks:
          -
            slot: 0
            stage: vertex
            size: 16
            struct_name: fa_post_vs_params
            inst_name: _51
            hlsl_register_b_n: 0
          -
            slot: 1
            stage: fragment
            size: 64
            struct_name: fa_post_params
            inst_name: _51
            hlsl_register_b_n: 1
          -
            slot: 5
            stage: fragment
            size: 16
            struct_name: fa_material
            inst_name: _144
            hlsl_register_b_n: 5
        views:
          -
            texture:
              slot: 0
              stage: fragment
              name: fa_scene
              multisampled: false
              type: 2d
              sample_type: float
              hlsl_register_t_n: 0
        samplers:
          -
            slot: 0
            stage: fragment
            name: fa_scene_smp
            sampler_type: filtering
            hlsl_register_s_n: 0
        texture_sampler_pairs:
          -
            slot: 0
            stage: fragment
            name: fa_scene_fa_scene_smp
            view_name: fa_scene
            sampler_name: fa_scene_smp
