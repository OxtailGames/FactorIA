// Generated by `factoria export --platform android` (template: platforms/android/app/build.gradle in the engine repo).
plugins {
    id 'com.android.application'
}

{{#source}}
def engineDir = providers.gradleProperty('factoria.engineDir').get()
def cmakeVer  = providers.gradleProperty('factoria.cmakeVersion').getOrElse('3.31.6')

{{/source}}
// Release signing: export.android.signing of factoria.json (keystore and alias, in gradle.properties). The passwords come only
// from the environment of the Gradle process (FACTORIA_ANDROID_KEYSTORE_PASSWORD, FACTORIA_ANDROID_KEY_PASSWORD), never from a
// file. Without a keystore the release build is signed with the debug key: fine for testing, Google Play rejects it.
def releaseKeystore = providers.gradleProperty('factoria.signing.keystore').orNull
def releaseAlias    = providers.gradleProperty('factoria.signing.alias').orNull
def hasReleaseKey   = releaseKeystore && releaseAlias
def releaseStorePassword = System.getenv('FACTORIA_ANDROID_KEYSTORE_PASSWORD')
def releaseKeyPassword   = System.getenv('FACTORIA_ANDROID_KEY_PASSWORD') ?: releaseStorePassword

gradle.taskGraph.whenReady { graph ->
    if (hasReleaseKey && !releaseStorePassword && graph.allTasks.any { it.path.startsWith(':app:') && it.name.toLowerCase().contains('release') })
        throw new GradleException('The release keystore password is not set. Set the environment variable FACTORIA_ANDROID_KEYSTORE_PASSWORD ' +
                                  '(and FACTORIA_ANDROID_KEY_PASSWORD if the key has its own password) before running a release build; ' +
                                  'factoria export reads them from the environment or from ~/.factoria/export.json. See docs/MOBILE.md (Signing).')
}

android {
    namespace '{{APPLICATION_ID}}'
    compileSdk {{TARGET_SDK}}
{{#source}}
    // Pin the NDK (AGP otherwise defaults to its own, e.g. 26.1.x; r27+ is needed for std::format). Install with sdkmanager "ndk;27.2.12479018".
    ndkVersion providers.gradleProperty('factoria.ndkVersion').getOrElse('27.2.12479018')
{{/source}}

    defaultConfig {
        applicationId '{{APPLICATION_ID}}'
        minSdk {{MIN_SDK}}
        targetSdk {{TARGET_SDK}}
        versionCode {{VERSION_CODE}}
        versionName '{{VERSION_NAME}}'

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
{{#source}}
        externalNativeBuild {
            cmake {
                arguments '-DFA_BUILD_TOOLS=OFF', '-DFA_BUILD_TESTS=OFF', '-DANDROID_STL=c++_static'
                targets 'factoria_player'
            }
        }
{{/source}}
    }
{{#source}}

    externalNativeBuild {
        cmake {
            path file("${engineDir}/CMakeLists.txt")
            version cmakeVer
        }
    }
{{/source}}

    sourceSets {
        main {
            // The game project (factoria.json, scenes/, scripts/, assets/ ...) plus assets_index.txt,
            // which the engine's VFS needs to list files inside the APK.
            assets.srcDirs = ['src/main/assets']
        }
    }

    // Package every game file (the default pattern skips dot-files and folders starting with "_").
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }{{PACKAGING_OPTIONS}}

    if (hasReleaseKey) {
        signingConfigs {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}{{PLUGIN_DEPENDENCIES}}
