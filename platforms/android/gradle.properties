{{#source}}
# Path of the FactorIA engine checkout (its CMakeLists.txt is built by app/build.gradle).
# Change it here if you move the engine; no need to export again.
factoria.engineDir={{ENGINE_ROOT}}
# CMake used by the Android Gradle plugin. The engine needs CMake 3.24+, newer than the SDK default:
#   sdkmanager "cmake;3.31.6"
factoria.cmakeVersion=3.31.6
{{/source}}
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# A Gradle daemon makes the next build quick; it stops after 15 idle minutes (the default is 3 hours).
org.gradle.daemon.idletimeout=900000
# Native plugins may depend on AndroidX libraries (Google Play Billing and Play Games do); the app itself uses none.
android.useAndroidX=true
android.nonTransitiveRClass=true
# The SDK levels of the app, read by the Gradle modules of native plugins (plugins/<name>/build.gradle).
factoria.compileSdk={{TARGET_SDK}}
factoria.minSdk={{MIN_SDK}}
{{SIGNING_PROPERTIES}}