// The Android side of the {{NAME}} plugin (the Google Play backend): a Gradle library module. `factoria export --platform android`
// copies it to plugins/{{NAME}} of the exported project and adds it to the app (docs/MOBILE.md, "Native plugins on Android").
//   src/main/jniLibs/<abi>/lib{{NAME}}.so    the C bridge, built by ../CMakeLists.txt (not by Gradle)
//   src/main/java/factoria/plugin/{{NAME}}/  the Java the bridge calls: Google Play Billing, Play Games Services, Play Integrity
//   src/main/res/values/games-ids.xml        the Play Games Services project id (empty: Play Games is off)
plugins {
    id 'com.android.library'
}

// The SDK levels of the game: the export writes them to gradle.properties of the project (the fallbacks are for a
// module opened on its own).
def compileSdkLevel = (findProperty('factoria.compileSdk') ?: 36) as int
def minSdkLevel     = (findProperty('factoria.minSdk') ?: 26) as int

android {
    namespace 'factoria.plugin.{{NAME}}'
    compileSdk compileSdkLevel

    defaultConfig {
        minSdk minSdkLevel
        // Keeps the classes the C code finds by name when the app is minified.
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Versions: the newest stable releases at the time the plugin was written (Google's Maven, dl.google.com/android/maven2).
dependencies {
    implementation 'com.android.billingclient:billing:9.1.0'               // Google Play Billing: purchases
    implementation 'com.google.android.gms:play-services-games-v2:22.1.0'  // Play Games Services v2: sign-in, achievements, leaderboards, Saved Games
    implementation 'com.google.android.play:integrity:1.6.0'               // Play Integrity: integrity.token
}
